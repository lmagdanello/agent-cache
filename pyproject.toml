[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cache"
version = "0.1.1"
description = "Agentic generative prompt cache with structural validation and safe fallback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0.0",
    "PyPDF2>=3.0.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
agent-cache = "agent_cache.cli:main"

[tool.setuptools]
packages = ["agent_cache"]
include-package-data = true

[tool.setuptools.package-data]
agent_cache = ["migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
