[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cache"
version = "0.1.0"
description = "Agentic generative prompt cache with structural validation and safe fallback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-cache = "agent_cache.cli:main"

[tool.setuptools]
packages = ["agent_cache"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
